# ==============================================================================
# HQ - AI Agent Headquarters
# Docker Compose Orchestration
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # MONGODB - Base de datos
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8
    container_name: hq-mongodb
    restart: unless-stopped
    # SELinux (Bazzite/Fedora): permite leer volumenes del host
    security_opt:
      - label=disable
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    # Sin ports expuestos al host: MongoDB solo es alcanzable dentro de
    # hq-network (patron Pentia: Nginx es el unico puerto de entrada).
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - agent_workspace:/data/agent-workspace
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hq-network

  # ---------------------------------------------------------------------------
  # API BACKEND - Node.js/Express
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hq-api
    restart: unless-stopped
    # SELinux (Bazzite/Fedora): permite acceder al socket de podman montado
    security_opt:
      - label=disable
    environment:
      # MongoDB
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      # HQ API Config
      API_PORT: ${API_PORT}
      API_JWT_SECRET: ${API_JWT_SECRET}
      UI_SECRET: ${UI_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      HQ_API_URL: ${HQ_API_URL}
      HQ_API_TOKEN: ${HQ_API_TOKEN}
      # Docker Engine API
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_SOCKET: /var/run/docker.sock
      # Agent Config
      AGENT_BASE_IMAGE: ${AGENT_BASE_IMAGE}
      HQ_AGENT_ORCHESTRATOR_IMAGE: ${HQ_AGENT_ORCHESTRATOR_IMAGE}
      AGENT_NETWORK: ${AGENT_NETWORK}
      AGENT_WORKSPACE_PATH: ${AGENT_WORKSPACE_PATH}
      HQ_FILES_PATH: ${HQ_FILES_PATH:-/data/hq-files}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # SMTP para invitaciones y recuperación de contraseña
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@ctangarife.com}
      FRONTEND_URL: ${FRONTEND_URL}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL}
      TELEGRAM_NOTIFICATION_CHAT_ID: ${TELEGRAM_NOTIFICATION_CHAT_ID}
      # LLM Providers - API Keys para credenciales
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL}
      ZAI_API_KEY: ${ZAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Config Service - Credenciales encriptadas
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_CONSOLE: ${LOG_CONSOLE}
    # Sin ports expuestos al host: la API solo es alcanzable via Nginx
    # (/api/* -> http://api:3001 por red Docker interna).
    volumes:
      # Código fuente para hot-reload en desarrollo
      - ./api/src:/app/src
      # Runtime socket para gestión de contenedores.
      # Usamos el socket rootless del usuario 1000 (no el system de root,
      # que el compose rootless no puede montar). Para que funcione, la API
      # corre como UID 1000 dentro del container (ver 'user:' abajo) — así
      # coincide con el dueño del socket rootless (srw------- 1000:1000).
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock
      # Workspace compartido con agentes
      - agent_workspace:${AGENT_WORKSPACE_PATH}
      # Mission files - Archivos de misiones (inputs, outputs, artifacts)
      - hq_files:/data/hq-files
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
    networks:
      - hq-network

  # ---------------------------------------------------------------------------
  # FRONTEND - Vue 3 Dashboard (Build estático)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./build/frontend
      dockerfile: Dockerfile
    container_name: hq-frontend
    # SELinux (Bazzite/Fedora): permite leer ./data/frontend del host
    security_opt:
      - label=disable
    volumes:
      # Código fuente
      - ./data/frontend:/app
      # Archivos estáticos compilados (para nginx)
      - ./data/static:/app/dist
    environment:
      # API URL (path relativo, via Nginx)
      VITE_API_URL: ${NEXT_PUBLIC_API_URL}
      # Ya NO exponemos VITE_UI_SECRET — estaba visible en el JS bundle
      # (F12 → Sources) y anulaba el multi-tenant. Auth es JWT via /login.
    command: sh -c "npm install && npm ci && NODE_ENV=production npm run build --max-old-space-size=4096"
    networks:
      - hq-network

  # ---------------------------------------------------------------------------
  # NGINX - Reverse Proxy + Static file server
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hq-nginx
    restart: unless-stopped
    # SELinux (Bazzite/Fedora): patron Pentia - permite leer conf y static del host
    security_opt:
      - label=disable
    ports:
      - "${NGINX_HOST_PORT}:80"
      - "${NGINX_HEALTH_PORT}:8080"
    volumes:
      # Configuración de nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Archivos estáticos del frontend
      - ./data/static:/usr/share/nginx/html/frontend:rw
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/nginx-health"]
      interval: 30s
      timeout: 5s
    networks:
      - hq-network

  # ---------------------------------------------------------------------------
  # HQ AGENT (OpenClaw-based) - Imagen base para agentes
  # ---------------------------------------------------------------------------
  hq-agent-openclaw:
    build:
      context: ./docker/hq-agent-openclaw
      dockerfile: Dockerfile
    image: hq-agent-openclaw:latest
    restart: "no"
    profiles:
      - build-only

  # ---------------------------------------------------------------------------
  # HQ AGENT ORCHESTRATOR (Goose-based) - Imagen persistente para Squad Lead/Auditor
  # ---------------------------------------------------------------------------
  # build-only: no levanta solo. docker.service.createAgentContainer la instancia
  # cuando crea orquestadores (rol squad_lead / auditor). Diferente de la efímera
  # hq-agent-goose: mantiene un proceso Node con polling loop continuo.
  hq-agent-orchestrator:
    build:
      context: ./docker/hq-agent-orchestrator
      dockerfile: Dockerfile
    image: hq-agent-orchestrator:latest
    restart: "no"
    profiles:
      - build-only

  # ---------------------------------------------------------------------------
  # AGENT BROWSER - Puppeteer automation (desde OpenClaw)
  # ---------------------------------------------------------------------------
  agent-browser:
    build:
      context: ./build/agent-browser
      dockerfile: Dockerfile
    container_name: hq-agent-browser-${AGENT_ID}
    restart: unless-stopped
    environment:
      BROWSER_PORT: 9222
    volumes:
      - agent_browser_workspace:/home/node/.openclaw/workspace/agent-browser:rw
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9222/health"]
      interval: 30s
      timeout: 10s
    networks:
      - hq-network

  # ---------------------------------------------------------------------------
  # VOLUMES - Datos persistentes
  # ---------------------------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  agent_workspace:
    driver: local
  agent_browser_workspace:
    driver: local
  hq_files:
    driver: local
    name: hq_files

  # ---------------------------------------------------------------------------
  # NETWORKS - Redes Docker
  # ---------------------------------------------------------------------------
networks:
  # Red principal de HQ
  hq-network:
    driver: bridge
  # Red donde se conectan los agentes (permite comunicación con Docker)
  agent-network:
    driver: bridge
    name: ${AGENT_NETWORK}

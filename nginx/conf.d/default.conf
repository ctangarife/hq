# ==============================================================================
# HQ - AI Agent Headquarters
# Nginx Site Configuration - Main Server
# ==============================================================================
# Patron Pentia: Nginx es el UNICO puerto de entrada.
#   /api/*      -> backend Express (api:3001) por red Docker interna
#   /*          -> frontend estatico (Vue 3 build)
# El backend y MongoDB NO se exponen al host; solo son alcanzables via Nginx.
# This file contains only the server block that is included from nginx.conf

# Upstream del backend (patron Pentia: nombre de servicio + keepalive).
# Hardcoded: en podman 'api' resuelve via /etc/hosts (10.89.x.x), y el
# depends_on: service_healthy del compose garantiza que la API este up
# antes de que nginx arranque. No hace falta resolver dinamico.
upstream backend_api {
    server api:3001;
    keepalive 32;
}

# Main server
server {
    listen 80;
    server_name _;
    server_tokens off;

    charset utf-8;

    access_log /var/log/nginx/hq.access.log;
    error_log /var/log/nginx/hq.error.log warn;

    # Body size para mission files / attachments
    client_max_body_size 50M;

    # ==================================================================
    # Security headers (aplicados a TODAS las respuestas)
    # ==================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Favicon and robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
        return 200 "User-agent: *\nDisallow:\n";
        add_header Content-Type text/plain;
    }

    # ==================================================================
    # API - Backend Services (patron Pentia: proxy al upstream interno)
    # ==================================================================
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        client_max_body_size 50M;
    }

    # ==================================================================
    # Telegram Webhook (mismo upstream interno)
    # ==================================================================
    location /telegram-webhook {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ==================================================================
    # Assets estaticos con cache largo (fingerprinted by Vite)
    # ==================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        root /usr/share/nginx/html/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri = /index.html;
    }

    # Assets especificos (dev)
    location /assets/ {
        root /usr/share/nginx/html/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==================================================================
    # Frontend - Vue 3 Dashboard (SPA fallback)
    # ==================================================================
    location / {
        root /usr/share/nginx/html/frontend;
        try_files $uri $uri/ /index.html;

        # No cachear index.html (traer version fresca)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==================================================================
    # Seguridad: bloquear archivos sensibles
    # ==================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(yml|yaml|env|config|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==============================================================================
# Goose Provider Configuration - HQ Agent (via LiteLLM proxy)
# ==============================================================================
# HQ centraliza TODOS los LLM calls a través del proxy LiteLLM en
# litellm.ctangarife.com. Esto da: budget tracking, rate limiting, fallback
# automático, y rotación de credenciales sin tocar cada agente.
#
# La virtual key se inyecta en runtime como OPENAI_API_KEY (la API de HQ la
# pasa al crear el container efímero). El provider es 'openai' porque el proxy
# expone endpoint 100% OpenAI-compatible.
#
# NOTA: Goose añade /v1/chat/completions al OPENAI_HOST automáticamente,
# por eso el host NO lleva sufijo /v1.
# ==============================================================================

# --- Provider: openai-compatible apuntando a LiteLLM ---
GOOSE_PROVIDER: openai
GOOSE_MODEL: glm-5.2

# Sin extensions MCP por defecto — se activan por profile si la tarea lo requiere
# (ej: researcher carga searxng + browser; writer no carga ninguna).
# Esto mantiene los containers efímeros lo más livianos posibles.
